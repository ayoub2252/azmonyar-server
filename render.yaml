services:
  - type: web
    name: azmonyar-server
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 16 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: TEACHER_KEY
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: azmonyar-data
      mountPath: /data
      sizeGB: 1
